# App de incidencias detrás de Nginx.
# Copia este archivo a /etc/nginx/conf.d/incidencias.conf y ajusta server_name.
# Para HTTPS, ejecuta después: certbot --nginx -d tu.dominio.com

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Debe ser mayor que MAX_UPLOAD_MB x 3 adjuntos + margen del formulario.
    client_max_body_size 20m;

    access_log /var/log/nginx/incidencias.access.log;
    error_log  /var/log/nginx/incidencias.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
