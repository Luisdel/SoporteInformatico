{% extends "base.html" %}
{% block title %}Inicio de sesión — Soporte Informático{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2.5rem auto;">
    <h1 style="margin-top:0;">Iniciar sesión</h1>
    <p class="muted">Acceso reservado al personal de soporte.</p>
    <form method="post" action="/admin/login" class="stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" name="username" id="username" required autofocus autocomplete="username">
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
</div>
{% endblock %}
